prefix: "<dark_gray>[<blue>mProfile</blue>]</dark_gray> "
loading: "<yellow>Profile data is still loading."
player-only: "<red>This command is available to players only."
no-permission: "<red>You do not have permission."
not-found: "<red>No stored profile was found for <white>{player}</white>."
private: "<red>This profile is private."
bio-updated: "<green>Your biography was updated."
bio-too-long: "<red>Biography may contain at most {limit} characters."
visibility-updated: "<green>Profile visibility changed to <white>{visibility}</white>."
theme-updated: "<green>Profile theme changed to <white>{theme}</white>."
invalid-visibility: "<red>Use PUBLIC, LIMITED or PRIVATE."
invalid-theme: "<red>Unknown theme. Available: {themes}"
reloaded: "<green>Configuration and messages reloaded."
storage-error: "<red>The profile could not be saved. Try again later."
usage: "<gray>/profile [player] | bio <text> | visibility <mode> | theme <name> | reload"
gui-status-online: "<green>Online"
gui-status-offline: "<gray>Last seen {time}"
gui-limited: "<yellow>This player hides detailed statistics."
gui-biography-empty: "<gray>No biography set"
