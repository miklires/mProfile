config-version: 2

language:
  # Available out of the box: en_US and ru_RU.
  default: en_US

profile:
  # The database schema stores at most 120 characters; larger values are clamped.
  default-visibility: PUBLIC
  maximum-biography-length: 120
  default-theme: BLUE
  # Theme names are case-insensitive and shown in command suggestions.
  themes: [BLUE, GREEN, RED, PURPLE, GOLD]
  theme-colors:
    BLUE: "<aqua>"
    GREEN: "<green>"
    RED: "<red>"
    PURPLE: "<light_purple>"
    GOLD: "<gold>"

access:
  view-cooldown-millis: 750
  right-click:
    enabled: true
    require-sneaking: true
    cancel-interaction: false

gui:
  # Leave empty to use the translated gui-title value from the language file.
  title: ""
  size: 54
  # Slots are numbered from 1 to gui.size. Invalid or duplicate slots are skipped safely.
  slots:
    identity: 14
    biography: 21
    statistics: 23
    integrations: 25
    activity: 41
  materials:
    biography: WRITABLE_BOOK
    statistics: DIAMOND_SWORD
    integrations: NAME_TAG
    activity: CLOCK

interactions:
  enabled: true
  # SUGGEST prepares a command for confirmation; RUN executes it immediately.
  actions:
    message:
      enabled: true
      slot: 47
      material: PAPER
      mode: SUGGEST
      command: "msg {player} "
      required-plugin: ""
    report:
      enabled: true
      slot: 49
      material: REDSTONE_TORCH
      mode: SUGGEST
      command: "report {player} "
      required-plugin: mReports
    ignore:
      enabled: true
      slot: 51
      material: BARRIER
      mode: SUGGEST
      command: "ignore {player}"
      required-plugin: mChat

metrics:
  # Disabled until a public bStats project ID is assigned.
  enabled: false
  bstats-id: 0

updates:
  enabled: true
  modrinth-project-id: "VIEc33gz"
