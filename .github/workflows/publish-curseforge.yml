name: Publish latest release to CurseForge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      PROJECT_NAME: mProfile
      PRIMARY_BASENAME: mProfile
      GAME_VERSION_NAMES: 26.2,Server,Paper,Purpur,Folia,Java 25
    steps:
      - uses: actions/checkout@v5

      - name: Download and publish latest release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSEFORGE_TOKEN"
          [[ "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]]

          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
          tag="$(jq -r '.tag_name' release.json)"
          version="${tag#v}"
          mkdir -p release-assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir release-assets
          primary="release-assets/$PRIMARY_BASENAME-$version.jar"
          test -f "$primary"

          auth="X-Api-Token: $CURSEFORGE_TOKEN"
          api="https://minecraft.curseforge.com/api"
          agent="User-Agent: miklires/$PROJECT_NAME/curseforge-publisher"
          curl --fail-with-body --silent --show-error --header "$auth" --header "$agent" "$api/game/versions" > curseforge-game-versions.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          available = {entry["name"] for entry in json.loads(Path("curseforge-game-versions.json").read_text(encoding="utf-8"))}
          wanted = [name.strip() for name in os.environ["GAME_VERSION_NAMES"].split(",") if name.strip()]
          selected = [name for name in wanted if name in available]
          if "26.2" not in selected:
              raise SystemExit("CurseForge does not currently expose Minecraft 26.2")
          Path("selected-game-versions.json").write_text(json.dumps(selected), encoding="utf-8")
          print("CurseForge versions: " + ", ".join(selected))
          PY

          changelog="$(jq -r '.body // empty' release.json)"
          if [ -z "$changelog" ]; then
            changelog="See the GitHub release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          fi
          jq -n \
            --arg changelog "$changelog" \
            --arg displayName "$PROJECT_NAME $version" \
            --slurpfile gameVersions selected-game-versions.json \
            '{changelog:$changelog,changelogType:"markdown",displayName:$displayName,gameVersionNames:$gameVersions[0],releaseType:"release",isMarkedForManualRelease:false}' \
            > curseforge-metadata.json

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "$auth" \
            --header "$agent" \
            --form 'metadata=<curseforge-metadata.json' \
            --form "file=@$primary" \
            "$api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            > curseforge-upload.json

          jq -e 'select((.id | type) == "number" and .id > 0) | {id}' curseforge-upload.json
          parent_id="$(jq -r '.id' curseforge-upload.json)"

          for secondary in release-assets/*.jar; do
            [ "$secondary" = "$primary" ] && continue
            [[ "$secondary" == *-plain.jar ]] && continue
            filename="$(basename "$secondary")"
            jq -n --argjson parentFileID "$parent_id" --arg displayName "$filename" \
              '{parentFileID:$parentFileID,displayName:$displayName,releaseType:"release"}' \
              > curseforge-secondary-metadata.json
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "$auth" \
              --header "$agent" \
              --form 'metadata=<curseforge-secondary-metadata.json' \
              --form "file=@$secondary" \
              "$api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
              > curseforge-secondary-upload.json
            jq -e --arg file "$filename" 'select((.id | type) == "number" and .id > 0) | {id,file:$file}' curseforge-secondary-upload.json
          done

